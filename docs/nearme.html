<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nearby Businesses Map</title>

  <!-- Leaflet CSS -->
<link 
  rel="stylesheet" 
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
  crossorigin=""
/>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-main: #0b0f19;
      --bg-card: rgba(15, 23, 42, 0.78);
      --bg-card-strong: rgba(17, 24, 39, 0.96);
      --bg-hover: rgba(30, 41, 59, 0.96);
      --bg-glass: rgba(15, 23, 42, 0.7);
      --bg-surface: rgba(148, 163, 184, 0.08);
      --bg-input: rgba(15, 23, 42, 0.9);
      --text-primary: #f8fafc;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
      --text-accent: #38bdf8;
      --border-subtle: rgba(148, 163, 184, 0.18);
      --border-strong: rgba(148, 163, 184, 0.28);
      --shadow-soft: 0 10px 30px rgba(2, 6, 23, 0.38);
      --primary-gradient: linear-gradient(135deg, #38bdf8, #2563eb 50%, #818cf8);
      --accent-gradient: linear-gradient(135deg, #f59e0b, #f97316);
      --success: #34d399;
      --danger: #f87171;
      --map-ring: #f59e0b;
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      background: var(--bg-main);
      color: var(--text-primary);
      font-family: 'Heebo', 'Rubik', sans-serif;
      direction: rtl;
      text-align: right;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(circle at top right, rgba(56, 189, 248, 0.16), transparent 20%),
        radial-gradient(circle at bottom left, rgba(249, 115, 22, 0.14), transparent 25%),
        var(--bg-main);
      color: var(--text-primary);
      overflow-x: hidden;
    }

    .app-background {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .glow-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.18;
      animation: orbFloat 20s infinite alternate ease-in-out;
    }

    .orb-1 {
      top: -10%;
      right: 12%;
      width: 520px;
      height: 520px;
      background: radial-gradient(circle, #38bdf8, #2563eb);
    }

    .orb-2 {
      top: 22%;
      left: -8%;
      width: 560px;
      height: 560px;
      background: radial-gradient(circle, #f43f5e, #7c2d12);
      animation-delay: -5s;
    }

    .orb-3 {
      bottom: -15%;
      right: 30%;
      width: 540px;
      height: 540px;
      background: radial-gradient(circle, #f59e0b, #b45309);
      animation-delay: -10s;
    }

    @keyframes orbFloat {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(28px, -20px) scale(1.08); }
      100% { transform: translate(-18px, 28px) scale(0.95); }
    }

    #header {
      position: sticky;
      top: 0;
      z-index: 1000;
      display: flex;
      justify-content: center;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      background: rgba(8, 12, 20, 0.64);
      border-bottom: 1px solid var(--border-subtle);
      box-shadow: 0 8px 24px rgba(2, 6, 23, 0.2);
      padding: 14px 20px;
    }

    #controls-top, #controls-radius {
      width: min(1280px, 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin: 0 auto;
    }

    #controls-top {
      margin-bottom: 8px;
    }

    #controls-radius {
      justify-content: flex-start;
      background: rgba(148, 163, 184, 0.04);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 10px 16px;
    }

    #status {
      flex: 1;
      min-height: 18px;
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text-primary);
      letter-spacing: 0.01em;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-left: auto;
      padding: 0.2rem 0.5rem;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: var(--primary-gradient);
      color: white;
      box-shadow: 0 12px 28px rgba(37, 99, 235, 0.35);
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .brand-title {
      font-family: 'Rubik', 'Heebo', sans-serif;
      font-size: 1.25rem;
      line-height: 1.1;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: #f8fafc;
      margin: 0;
    }

    .brand-accent {
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      display: inline-block;
    }

    .brand-subtitle {
      margin: 0;
      font-size: 0.73rem;
      color: var(--text-muted);
      letter-spacing: 0.01em;
    }

    .btn {
      appearance: none;
      border: 1px solid rgba(56, 189, 248, 0.3);
      background: var(--primary-gradient);
      color: white;
      padding: 10px 16px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.83rem;
      line-height: 1;
      transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
      box-shadow: 0 12px 24px rgba(37, 99, 235, 0.2);
      white-space: nowrap;
    }

    .btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.04);
    }

    .btn.active {
      background: linear-gradient(135deg, #f59e0b, #f97316);
      border-color: rgba(249, 115, 22, 0.45);
      box-shadow: 0 12px 24px rgba(249, 115, 22, 0.2);
    }

    #controls-radius label {
      color: var(--text-secondary);
      font-size: 0.9rem;
      font-weight: 600;
      flex-shrink: 0;
    }

    #radius-slider-container {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 200px;
    }

    #radius-slider {
      flex: 1;
      accent-color: #38bdf8;
      cursor: pointer;
    }

    #radius-value {
      min-width: 40px;
      text-align: center;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.25);
      color: var(--text-primary);
      font-weight: 700;
      font-size: 0.82rem;
    }

    #map-container {
      position: relative;
      width: min(1280px, calc(100% - 28px));
      margin: 18px auto 22px;
      border: 1px solid var(--border-subtle);
      border-radius: 24px;
      overflow: hidden;
      background: rgba(15, 23, 42, 0.72);
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 1;
    }

    #map {
      height: 42vh;
      width: 100%;
      min-height: 320px;
      background: #0f172a;
    }

    #filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      width: min(1280px, calc(100% - 28px));
      margin: 14px auto 0;
      padding: 10px 14px;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--border-subtle);
      border-radius: 18px;
      box-shadow: 0 8px 20px rgba(2, 6, 23, 0.12);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .filter-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.05);
      border: 1px solid rgba(148, 163, 184, 0.18);
      color: var(--text-secondary);
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s ease;
      user-select: none;
    }

    .filter-chip:hover {
      background: rgba(148, 163, 184, 0.1);
      border-color: rgba(148, 163, 184, 0.3);
    }

    .filter-chip.active {
      background: rgba(56, 189, 248, 0.15);
      border-color: rgba(56, 189, 248, 0.38);
      color: #f8fafc;
    }

    .filter-chip[data-club="MCC"].active {
      background: rgba(245, 158, 11, 0.12);
      border-color: rgba(245, 158, 11, 0.4);
    }
    .filter-chip[data-club="HOT"].active {
      background: rgba(244, 63, 94, 0.12);
      border-color: rgba(244, 63, 94, 0.4);
    }
    .filter-chip[data-club="HTzone"].active {
      background: rgba(6, 182, 212, 0.12);
      border-color: rgba(6, 182, 212, 0.4);
    }
    .filter-chip[data-club="BUYME"].active {
      background: rgba(59, 130, 246, 0.12);
      border-color: rgba(59, 130, 246, 0.4);
    }

    .chip-checkbox {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border-radius: 6px;
      background: rgba(255,255,255,0.08);
      color: transparent;
      font-size: 0.7rem;
      font-weight: 900;
      line-height: 1;
    }

    .filter-chip.active .chip-checkbox {
      background: #f8fafc;
      color: #0b0f19;
    }

    .club-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 46px;
      padding: 5px 8px;
      border-radius: 8px;
      color: white;
      font-size: 0.72rem;
      font-weight: 800;
      line-height: 1;
    }

    .club-badge.mcc { background: linear-gradient(135deg, #f59e0b, #d97706); color: #1f2937; }
    .club-badge.hot { background: linear-gradient(135deg, #f43f5e, #e11d48); }
    .club-badge.htzone { background: linear-gradient(135deg, #06b6d4, #2563eb); }
    .club-badge.buyme { background: linear-gradient(135deg, #60a5fa, #2563eb); }

    #business-list-container {
      max-height: 34vh;
      overflow-y: auto;
      background: rgba(15, 23, 42, 0.8);
      border-top: 1px solid var(--border-subtle);
      scrollbar-width: thin;
      scrollbar-color: rgba(148, 163, 184, 0.5) transparent;
      padding: 12px 14px 18px;
    }

    #business-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 12px;
    }

    .business-item {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 16px 12px;
      border-radius: 18px;
      border: 1px solid rgba(148, 163, 184, 0.18);
      background: rgba(15, 23, 42, 0.8);
      box-shadow: 0 8px 22px rgba(2, 6, 23, 0.14);
      transition: border-color 0.2s ease, transform 0.2s ease, background 0.2s ease;
      cursor: pointer;
      min-height: 190px;
    }

    .business-item:hover {
      background: rgba(30, 41, 59, 0.56);
      border-color: rgba(56, 189, 248, 0.26);
      transform: translateY(-2px);
    }

    .business-item:last-child {
      border-bottom: none;
    }

    .business-info {
      min-width: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .business-info h3 {
      margin: 0;
      font-size: 1.04rem;
      line-height: 1.35;
      font-weight: 700;
      color: var(--text-primary);
      word-break: break-word;
    }

    .business-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.82rem;
      color: var(--text-secondary);
    }

    .discount-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 2px;
    }

    .discount-line {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 7px 9px;
      border-radius: 10px;
      background: rgba(148, 163, 184, 0.05);
      border: 1px solid rgba(148, 163, 184, 0.12);
    }

    .discount-line strong {
      color: var(--text-primary);
      font-size: 0.76rem;
      font-weight: 700;
      word-break: break-word;
    }

    .discount-line a {
      color: #7dd3fc;
      text-decoration: none;
      font-size: 0.72rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .business-item-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: auto;
    }

    .distance {
      font-weight: 800;
      color: #34d399;
      letter-spacing: 0.01em;
      font-size: 0.82rem;
    }

    .list-btn, .map-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #38bdf8, #2563eb);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: white;
      text-decoration: none;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 0.8rem;
      font-weight: 700;
      transition: transform 0.2s ease, filter 0.2s ease;
      white-space: nowrap;
    }

    .list-btn {
      margin-right: auto;
      margin-left: 0;
      flex-shrink: 0;
    }

    .map-btn:hover, .list-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.04);
    }

    .leaflet-container {
      font-family: 'Heebo', sans-serif;
      background: #0f172a;
    }

    .leaflet-popup-content-wrapper,
    .leaflet-popup-tip {
      background: rgba(15, 23, 42, 0.96);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
      box-shadow: 0 12px 30px rgba(2, 6, 23, 0.28);
    }

    .leaflet-popup-content {
      direction: rtl;
      text-align: right;
      font-family: 'Heebo', sans-serif;
      margin: 12px 14px;
      color: var(--text-primary);
    }

    .leaflet-control-zoom a {
      background: rgba(15, 23, 42, 0.9);
      color: var(--text-primary);
      border-color: var(--border-subtle);
    }

    .leaflet-control-attribution {
      background: rgba(15, 23, 42, 0.7);
      color: var(--text-secondary);
    }

    .club-pin {
      width: 18px;
      height: 18px;
      border-radius: 50% 50% 50% 0;
      background: var(--pin-color);
      border: 2px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 6px 18px rgba(2, 6, 23, 0.35);
      transform: rotate(-45deg);
      position: relative;
      display: block;
    }

    .club-pin::after {
      content: "";
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.9);
      top: 5px;
      left: 5px;
    }

    .user-pin {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f8fafc, #cbd5e1);
      border: 2px solid rgba(15, 23, 42, 0.9);
      box-shadow: 0 8px 20px rgba(2, 6, 23, 0.35);
      display: grid;
      place-items: center;
      font-size: 16px;
      line-height: 1;
      transform: translateY(-1px);
    }

    #details-pane {
      display: none;
      position: absolute;
      right: 16px;
      top: 18px;
      width: min(320px, calc(100% - 32px));
      max-height: 60vh;
      overflow: auto;
      background: rgba(15, 23, 42, 0.96);
      border: 1px solid var(--border-subtle);
      border-radius: 18px;
      box-shadow: 0 18px 44px rgba(2, 6, 23, 0.38);
      z-index: 2000;
      padding: 14px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    #details-close {
      float: left;
      background: linear-gradient(135deg, #f87171, #ef4444);
      color: white;
      border: none;
      padding: 7px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
      margin-bottom: 8px;
    }

    #details-content {
      clear: both;
      color: var(--text-primary);
    }

    #details-content h3 {
      margin: 0 0 10px;
      font-size: 1.08rem;
      line-height: 1.45;
    }

    #details-content .meta {
      color: var(--text-secondary);
      font-size: 0.9rem;
      margin-bottom: 10px;
    }

    #details-content .deal-item {
      padding: 10px 0;
      border-bottom: 1px solid var(--border-subtle);
    }

    #details-content .deal-item:last-child {
      border-bottom: none;
    }

    @media (max-width: 720px) {
      #header {
        padding: 12px 12px 10px;
      }

      #controls-top, #controls-radius {
        width: 100%;
        flex-wrap: wrap;
      }

      #controls-top {
        align-items: flex-start;
      }

      #status {
        width: 100%;
        order: 1;
      }

      .btn {
        width: 100%;
        justify-content: center;
      }

      #controls-radius {
        padding: 10px 12px;
      }

      #map-container {
        width: calc(100% - 16px);
        border-radius: 18px;
      }

      .business-item {
        padding: 14px 12px;
        align-items: flex-start;
      }

      .business-info h3 {
        font-size: 0.98rem;
      }

      .business-info p {
        font-size: 0.8rem;
      }

      .list-btn {
        padding: 8px 10px;
        font-size: 0.75rem;
      }
    }
  </style>
</head>
<body>
  <div class="app-background">
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
    <div class="glow-orb orb-3"></div>
  </div>

  <div id="header">
    <div id="controls-top">
      <div class="brand" aria-label="Discount Finder brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="5" width="20" height="14" rx="2"></rect>
            <line x1="2" y1="10" x2="22" y2="10"></line>
          </svg>
        </div>
        <div class="brand-text">
          <h1 class="brand-title">Discount<span class="brand-accent">Finder</span></h1>
          <p class="brand-subtitle">חיפוש עסקים קרובים</p>
        </div>
      </div>
      <div id="status">טוען את המפה...</div>
      <button id="pin-btn" class="btn" onclick="togglePinMode()">📍 בחר מיקום על המפה</button>
    </div>
    <div id="controls-radius">
        <label for="radius-slider">רדיוס חיפוש (ק"מ):</label>
        <div id="radius-slider-container">
            <input type="range" id="radius-slider" min="0.5" max="5" step="0.1" value="1.0" oninput="updateRadiusFromSlider(this.value)">
            <span id="radius-value">1.0</span>
        </div>
    </div>
  </div>

  <div id="filter-row" aria-label="סינון לפי מועדון">
    <button class="filter-chip active" data-club="ALL" type="button"><span class="chip-checkbox">✓</span>הכל</button>
    <button class="filter-chip" data-club="MCC" type="button"><span class="chip-checkbox">✓</span><span class="club-badge mcc">חבר</span></button>
    <button class="filter-chip" data-club="HOT" type="button"><span class="chip-checkbox">✓</span><span class="club-badge hot">HOT</span></button>
    <button class="filter-chip" data-club="HTzone" type="button"><span class="chip-checkbox">✓</span><span class="club-badge htzone">HTzone</span></button>
    <button class="filter-chip" data-club="BUYME" type="button"><span class="chip-checkbox">✓</span><span class="club-badge buyme">BUYME</span></button>
  </div>

  <!-- Map and List Container -->
  <div id="map-container">
    <!-- Map -->
    <div id="map"></div>
    
    <!-- Business List -->
    <div id="business-list-container">
      <ul id="business-list">
          <!-- List items will be inserted here -->
      </ul>
    </div>
    <!-- Details Pane -->
    <div id="details-pane" style="display:none;">
      <button id="details-close" style="float:left;background:#e74c3c;color:#fff;border:none;padding:6px 10px;border-radius:6px;cursor:pointer;margin-bottom:8px;">סגור</button>
      <div id="details-content"></div>
    </div>
  </div>

<!-- Official Leaflet 1.9.4 JavaScript -->
<script 
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
  crossorigin=""
></script>

  <script>
    // Global State
    let map = null;
    let userMarker = null;
    let radiusCircle = null;
    let businessLayerGroup = L.layerGroup();
    const CLUB_KEYS = ['MCC', 'HOT', 'HTzone', 'BUYME'];
    let selectedClubs = new Set(CLUB_KEYS);
    
    let isPinMode = false;
    let currentUserLat = 32.0853; // Default Tel Aviv center fallback
    let currentUserLon = 34.7818;
    let currentSearchRadiusKm = 1.0; // Updated from const to let

    const REGION_BOUNDS = [
      { threshold: 30.0, file: 'businesses_eilat_arava.json' },
      { threshold: 31.3, file: 'businesses_south.json' },
      { threshold: 32.5, file: 'businesses_center.json' },
      { threshold: Infinity, file: 'businesses_north.json' }
    ];

    function getRegionFileForLat(lat) {
      for (const bound of REGION_BOUNDS) {
        if (lat < bound.threshold) return bound.file;
      }
      return 'businesses_north.json';
    }

    function getRequiredRegionFiles(minLat, maxLat) {
      const fileMin = getRegionFileForLat(minLat);
      const fileMax = getRegionFileForLat(maxLat);
      return Array.from(new Set([fileMin, fileMax]));
    }

    function haversineDistance(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = 
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    const CLUB_PIN_COLORS = {
      MCC: '#f59e0b',
      HOT: '#f43f5e',
      HTzone: '#06b6d4',
      BUYME: '#60a5fa',
      default: '#38bdf8'
    };

    function createClubPinIcon(club) {
      const color = CLUB_PIN_COLORS[club] || CLUB_PIN_COLORS.default;
      return L.divIcon({
        className: 'club-pin-wrapper',
        html: `<span class="club-pin" style="--pin-color: ${color};"></span>`,
        iconSize: [18, 18],
        iconAnchor: [9, 18],
        popupAnchor: [0, -16]
      });
    }

    function createUserPinIcon() {
      return L.divIcon({
        className: 'user-pin-wrapper',
        html: '<span class="user-pin">👤</span>',
        iconSize: [28, 28],
        iconAnchor: [14, 28],
        popupAnchor: [0, -20]
      });
    }

    // Initialize Map Instance
    function initMap(initialLat, initialLon) {
      if (map) return; // Prevent double init

      map = L.map('map').setView([initialLat, initialLon], 14);

      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
      }).addTo(map);

      businessLayerGroup.addTo(map);

      // Handle Map Clicks when "Pin Mode" is active
      map.on('click', (e) => {
        if (isPinMode) {
          updateUserLocation(e.latlng.lat, e.latlng.lng);
          togglePinMode(false); // Exit pin mode after setting
        }
      });
    }

    // Toggle Pin Mode Button State
    function togglePinMode(forceState) {
      if (typeof forceState === 'boolean') {
        isPinMode = forceState;
      } else {
        isPinMode = !isPinMode;
      }

      const btn = document.getElementById('pin-btn');
      const statusDiv = document.getElementById('status');

      if (isPinMode) {
        btn.classList.add('active');
        btn.innerText = '❌ ביטול בחירה';
        statusDiv.innerText = 'לחץ על מקום כלשהו במפה כדי לקבוע את המיקום שלך...';
        document.getElementById('map').style.cursor = 'crosshair';
      } else {
        btn.classList.remove('active');
        btn.innerText = '📍 בחר מיקום על המפה';
        document.getElementById('map').style.cursor = '';
      }
    }

    function getSelectedClubDiscounts(business) {
      const discounts = Array.isArray(business.discounts) ? business.discounts : [];
      const activeSet = selectedClubs;
      return discounts.filter((d) => {
        const club = d.club || d.club_name || '';
        return activeSet.has(club) || (activeSet.size === CLUB_KEYS.length && club);
      });
    }

    function updateClubFiltersUI() {
      document.querySelectorAll('.filter-chip').forEach((chip) => {
        const club = chip.getAttribute('data-club');
        const active = club === 'ALL' ? selectedClubs.size === CLUB_KEYS.length : selectedClubs.has(club);
        chip.classList.toggle('active', active);
      });
    }

    function attachClubFilterHandlers() {
      document.querySelectorAll('.filter-chip').forEach((chip) => {
        chip.addEventListener('click', () => {
          const clickedClub = chip.getAttribute('data-club');
          if (clickedClub === 'ALL') {
            selectedClubs = new Set(CLUB_KEYS);
          } else {
            const isAllSelected = selectedClubs.size === CLUB_KEYS.length;
            if (isAllSelected) {
              selectedClubs = new Set([clickedClub]);
            } else if (selectedClubs.has(clickedClub)) {
              selectedClubs.delete(clickedClub);
              if (selectedClubs.size === 0) {
                selectedClubs = new Set(CLUB_KEYS);
              }
            } else {
              selectedClubs.add(clickedClub);
            }
          }
          updateClubFiltersUI();
          if (radiusCircle) {
            updateUserLocation(currentUserLat, currentUserLon);
          }
        });
      });
    }

    function updateClubFiltersUI() {
      document.querySelectorAll('.filter-chip').forEach((chip) => {
        const club = chip.getAttribute('data-club');
        const active = club === 'ALL' ? selectedClubs.size === CLUB_KEYS.length : selectedClubs.has(club);
        chip.classList.toggle('active', active);
      });
    }

    // Update Radius from Slider
    function updateRadiusFromSlider(value) {
        currentSearchRadiusKm = parseFloat(value);
        document.getElementById('radius-value').innerText = currentSearchRadiusKm.toFixed(1);
        
        // Only update map elements if they exist (app already initialized)
        if (radiusCircle) {
            radiusCircle.setRadius(currentSearchRadiusKm * 1000);
            updateUserLocation(currentUserLat, currentUserLon); // Re-fetch and re-filter
        }
    }

    function renderBusinessCards(nearby) {
      const listContainer = document.getElementById('business-list');
      listContainer.innerHTML = '';

      if (!nearby.length) {
        listContainer.innerHTML = '<li class="business-item"><div class="business-info"><h3>אין עסקים להצגה</h3><p>נסו להוריד את רדיוס החיפוש או לבחור מועדון אחר.</p></div></li>';
        return;
      }

      nearby.forEach((b) => {
        const relatedDiscounts = getSelectedClubDiscounts(b);
        if (!relatedDiscounts.length) return;

        const listItem = document.createElement('li');
        listItem.className = 'business-item';

        const discountLines = relatedDiscounts.slice(0, 3).map((d) => {
          const club = d.club || 'MCC';
          const text = d.discount || d.discount_text || 'הטבה';
          const url = d.discount_url || d.url || '#';
          const badgeClass = (club || '').toLowerCase();
          const label = club === 'HTzone' ? 'HTzone' : club === 'BUYME' ? 'BUYME' : club;
          return `
            <div class="discount-line">
              <span class="club-badge ${badgeClass === 'htzone' ? 'htzone' : badgeClass === 'buyme' ? 'buyme' : badgeClass === 'hot' ? 'hot' : 'mcc'}">${label}</span>
              <strong>${text}</strong>
              <a href="${url}" target="_blank" rel="noopener noreferrer">לינק</a>
            </div>
          `;
        }).join('');

        const title = b.name || b.business_name || 'עסק';
        const gmapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${b.lat},${b.lon}`;
        const bestDiscount = relatedDiscounts.find((d) => (d.discount || '').toString().match(/\d+\s*%|\d+\s*אחוז/i)) || relatedDiscounts[0];

        listItem.innerHTML = `
          <div class="business-info">
            <h3>${title}</h3>
            <div class="business-meta">
              <span>${b.type || 'עסק'}</span>
              <span class="distance">${Math.round(b.distance * 1000)} מ'</span>
            </div>
            <div class="discount-list">${discountLines}</div>
          </div>
          <div class="business-item-footer">
            <span class="club-badge ${((bestDiscount.club || 'MCC').toLowerCase() === 'htzone' ? 'htzone' : (bestDiscount.club || 'MCC').toLowerCase() === 'buyme' ? 'buyme' : (bestDiscount.club || 'MCC').toLowerCase() === 'hot' ? 'hot' : 'mcc')}">${(bestDiscount.club || 'MCC') === 'HTzone' ? 'HTzone' : (bestDiscount.club || 'MCC') === 'BUYME' ? 'BUYME' : (bestDiscount.club || 'MCC') === 'HOT' ? 'HOT' : 'חבר'}</span>
            <a href="${gmapsUrl}" target="_blank" class="list-btn">ניווט</a>
          </div>
        `;

        listItem.addEventListener('click', (e) => {
          if (e.target.closest('a')) return;
          showDetailsPane(b);
        });
        listContainer.appendChild(listItem);
      });
    }

    // Updates User Marker, Circle Radius, and Fetches Businesses
    async function updateUserLocation(lat, lon) {
      currentUserLat = lat;
      currentUserLon = lon;

      initMap(lat, lon);

      // Update or create Draggable User Marker
      if (userMarker) {
        userMarker.setLatLng([lat, lon]);
      } else {
        userMarker = L.marker([lat, lon], {
          draggable: true,
          title: 'גרור כדי לשנות מיקום',
          icon: createUserPinIcon()
        }).addTo(map).bindPopup('<b>המיקום שלך</b><br>ניתן לגרור אותי במפה!');

        userMarker.on('dragend', (e) => {
          const newPos = e.target.getLatLng();
          updateUserLocation(newPos.lat, newPos.lng);
        });
      }

      // Update or create radius circle
      if (radiusCircle) {
        radiusCircle.setLatLng([lat, lon]);
        radiusCircle.setRadius(currentSearchRadiusKm * 1000); // Ensure radius is correct
      } else {
        radiusCircle = L.circle([lat, lon], {
          radius: currentSearchRadiusKm * 1000,
          color: '#e67e22',
          fillColor: '#e67e22',
          fillOpacity: 0.1,
          weight: 2,
          dashArray: '6, 6'
        }).addTo(map);
      }

      map.panTo([lat, lon]);

      // Calculate Bounding Box based on current radius
      const latDelta = currentSearchRadiusKm / 111.0;
      const lonDelta = currentSearchRadiusKm / (111.0 * Math.cos(lat * Math.PI / 180));

      const minLat = lat - latDelta;
      const maxLat = lat + latDelta;
      const minLon = lon - lonDelta;
      const maxLon = lon + lonDelta;

      const statusDiv = document.getElementById('status');
      const listContainer = document.getElementById('business-list');

      statusDiv.innerText = `טוען רשימת עסקים עם מבצעים (client-side)...`;
      listContainer.innerHTML = ''; // Clear previous list

      try {
        // Load the precomputed businesses_with_discounts.json produced by the join script
        const path = 'data/businesses_with_discounts.json';
        console.debug('Fetching businesses with discounts from', path);
        const res = await fetch(path);
        if (!res.ok) throw new Error(`HTTP ${res.status} when loading ${path}`);
        const allBusinesses = await res.json();

        let nearby = [];
        for (const b of allBusinesses) {
          const bLat = b.lat || b.latitude || b.location?.lat;
          const bLon = b.lng || b.lon || b.location?.lng;
          if (bLat == null || bLon == null) continue;
          // quick bbox check
          if (bLat >= minLat && bLat <= maxLat && bLon >= minLon && bLon <= maxLon) {
            const dist = haversineDistance(lat, lon, bLat, bLon);
            if (dist <= currentSearchRadiusKm) {
              nearby.push({ ...b, distance: dist, lat: bLat, lon: bLon });
            }
          }
        }

        const filteredNearby = nearby.filter((b) => {
          const matchingDiscounts = getSelectedClubDiscounts(b);
          return matchingDiscounts.length > 0;
        });

        // Sort by distance (closest first)
        filteredNearby.sort((a, b) => a.distance - b.distance);

        businessLayerGroup.clearLayers();

        if (filteredNearby.length === 0) {
            statusDiv.innerText = `לא נמצאו עסקים ברדיוס ${currentSearchRadiusKm.toFixed(1)} ק"מ.`;
            listContainer.innerHTML = '<li class="business-item"><div class="business-info"><h3>אין עסקים להצגה</h3><p>נסו להוריד את רדיוס החיפוש או לבחור מועדון אחר.</p></div></li>';
        } else {
            statusDiv.innerText = `נמצאו ${filteredNearby.length} עסקים ברדיוס ${currentSearchRadiusKm.toFixed(1)} ק"מ:`;
            
            filteredNearby.forEach(b => {
                const distanceMeters = Math.round(b.distance * 1000);
                const matchingDiscounts = getSelectedClubDiscounts(b);
                const businessClub = matchingDiscounts[0]?.club || 'MCC';
                const marker = L.marker([b.lat, b.lon], { icon: createClubPinIcon(businessClub) });
                
                const gmapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${b.lat},${b.lon}`;

                const discountsHtml = matchingDiscounts.slice(0,3).map(d => {
                  const club = d.club || '';
                  const text = d.discount || d.discount_text || '';
                  const url = d.discount_url || d.url || '';
                  const urlHtml = url ? `<a href="${url}" target="_blank" class="map-btn" style="margin-left:6px;">הצג</a>` : '';
                  return `<div style="margin-bottom:6px;"><b>${club}</b>: ${text} ${urlHtml}</div>`;
                }).join('');

                const popupContent = `
                  <div style="min-width: 180px;">
                    <h3 style="margin: 0 0 5px 0; font-size: 15px;">${b.name}</h3>
                    <p style="margin: 0 0 5px 0; color: #cbd5e1;">סוג: <b>${b.type || ''}</b></p>
                    <p style="margin: 0 0 8px 0; color: #34d399; font-weight: bold;">מרחק: ${distanceMeters} מטרים</p>
                    ${discountsHtml || '<div style="color:#cbd5e1;">אין מבצעים משויכים</div>'}
                    <div style="margin-top:6px;"><a href="${gmapsUrl}" target="_blank" class="map-btn">ניווט ב-Google Maps</a></div>
                  </div>
                `;
                marker.bindPopup(popupContent);
                businessLayerGroup.addLayer(marker);
            });

            renderBusinessCards(filteredNearby);
        }

      } catch (err) {
        statusDiv.innerText = 'שגיאה בטעינת נתונים: ' + err.message;
        listContainer.innerHTML = `<li class="business-item"><p style="color: red;">שגיאה: ${err.message}</p></li>`;
      }
    }

    // App Initialization with GPS Fallback
    function initApp() {
      const statusDiv = document.getElementById('status');
      statusDiv.innerText = 'מבקש הרשאת מיקום...';

      // Instantly load map at default fallback location (Tel Aviv) so the user never sees a blank screen
      initMap(currentUserLat, currentUserLon);

      if ('geolocation' in navigator) {
        // Timeout GPS after 5 seconds if browser hangs
        navigator.geolocation.getCurrentPosition(
          (position) => {
            updateUserLocation(position.coords.latitude, position.coords.longitude);
          },
          (error) => {
            statusDiv.innerText = 'לא התקבל מיקום GPS. ניתן ללחוץ על "בחר מיקום על המפה".';
            updateUserLocation(currentUserLat, currentUserLon); // Load default view
          },
          { timeout: 5000, enableHighAccuracy: true }
        );
      } else {
        statusDiv.innerText = 'הדפדפן אינו תומך ב-GPS. השתמש בלחצן לבחירת מיקום.';
        updateUserLocation(currentUserLat, currentUserLon);
      }
    }

    // Run on startup
    window.addEventListener('DOMContentLoaded', () => {
      updateClubFiltersUI();
      attachClubFilterHandlers();
      initApp();
    });

    // Details pane functions
    function showDetailsPane(business) {
      const pane = document.getElementById('details-pane');
      const content = document.getElementById('details-content');
      const closeBtn = document.getElementById('details-close');
      content.innerHTML = '';
      const title = document.createElement('h3');
      title.style.marginTop = '0';
      title.textContent = business.name || 'פרטי עסק';
      content.appendChild(title);

      const meta = document.createElement('div');
      meta.style.color = '#666';
      meta.innerHTML = `<div>מרחק: <b>${Math.round(business.distance*1000)} מטר</b></div>`;
      content.appendChild(meta);

      const discounts = business.discounts || [];
      if (discounts.length === 0) {
        const p = document.createElement('p');
        p.textContent = 'אין מבצעים משויכים לעסק זה.';
        content.appendChild(p);
      } else {
        const list = document.createElement('div');
        list.style.marginTop = '8px';
        discounts.forEach(d => {
          const item = document.createElement('div');
          item.style.padding = '8px';
          item.style.borderBottom = '1px solid #eee';
          const club = d.club || '';
          const text = d.discount || d.discount_text || '';
          const url = d.discount_url || d.url || '';
          item.innerHTML = `<div style="font-weight:600">${club}</div><div style="margin-top:6px;">${text}</div>`;
          if (url) {
            const a = document.createElement('a');
            a.href = url;
            a.textContent = 'לינק להצעה';
            a.target = '_blank';
            a.style.display = 'inline-block';
            a.style.marginTop = '6px';
            a.className = 'map-btn';
            item.appendChild(a);
          }
          list.appendChild(item);
        });
        content.appendChild(list);
      }

      pane.style.display = 'block';
      closeBtn.onclick = () => { pane.style.display = 'none'; };
    }
  </script>
