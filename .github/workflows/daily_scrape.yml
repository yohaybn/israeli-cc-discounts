name: Daily Discount Scraper

on:
  schedule:
    # Runs every day at 06:00 UTC (6am)
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Connect Tailscale VPN (Israeli Exit Node)
        uses: tailscale/github-action@v2
        if: ${{ secrets.TAILSCALE_AUTHKEY != '' }}
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          args: --exit-node=${{ secrets.TAILSCALE_EXIT_NODE }}

      - name: Run Scraper
        run: python main.py
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}

      - name: Commit and push updated JSON results
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto update discount data [skip ci]"
          file_pattern: "data/*.json"
