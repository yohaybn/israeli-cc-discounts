name: Daily Discount Scraper

on:
  schedule:
    # Runs every day at 06:00 UTC (6am)
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scraper
        run: python main.py

      - name: Commit and push updated JSON results
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto update discount data [skip ci]"
          file_pattern: "data/*.json"
