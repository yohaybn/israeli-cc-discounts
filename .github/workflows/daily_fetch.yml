name: Daily OSM Fetch

on:
  schedule:
    # הרצה יומית בשעה 02:00 בלילה (UTC)
    - cron: '0 2 * * *'
  workflow_dispatch: # מאפשר הרצה ידנית מתוך ממשק GitHub לשם בדיקה

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # הרשאה לבצע Commit לרפוזיטורי

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run fetch script
        run: python fetch_osm_data.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/businesses/*.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated update of regional JSON business files" && git push)